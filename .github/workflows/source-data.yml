name: Reference source data
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test filtering and evidence handling
        run: python -m unittest discover -s tests -p 'test_sources.py' -v
      - name: Rebuild pinned reference data and compare every generated byte
        run: python tools/prepare_sources.py --source-dir "$RUNNER_TEMP/craftpilot-sources" --download --check
