name: Publish GitHub alpha
on:
  push:
    tags: ['v0.9.0-alpha', 'v0.10.2-alpha', 'v0.11.0-alpha', 'v0.11.1-alpha', 'v0.12.0-alpha', 'v0.12.1-alpha', 'v0.12.2-alpha', 'v0.13.0-alpha', 'v0.14.0-alpha', 'v0.15.0-alpha', 'v0.15.1-alpha', 'v0.16.0-alpha']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Validate runtime
        run: |
          for file in *.lua Locales/*.lua ThirdParty/CraftLadder/*.lua tests/*.lua; do luac5.4 -p "$file"; done
          lua5.4 tests/test.lua
      - name: Verify install archive
        run: python tools/build_release.py --check
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "dist/CraftPilot-${RELEASE_TAG#v}.zip" --verify-tag --prerelease --title "CraftPilot ${RELEASE_TAG#v}" --notes-file "docs/RELEASE_${RELEASE_TAG#v}.md"
