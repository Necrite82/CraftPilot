name: Release
# Push a tag such as v0.1.1-beta: tests, archive check, GitHub release and CurseForge upload.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4
      - name: Validate runtime
        run: |
          for version in 5.1 5.4; do
            for file in *.lua Locales/*.lua ThirdParty/*/*.lua tests/*.lua; do "luac$version" -p "$file"; done
            "lua$version" tests/test.lua
          done
      - name: Verify install archive
        run: python tools/build_release.py --check
      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "## Version: $VERSION" CraftPilot.toc
          test -f "dist/CraftPilot-$VERSION.zip" && test -f "docs/RELEASE_$VERSION.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/CraftPilot-$VERSION.zip" --verify-tag --title "CraftPilot $VERSION" --notes-file "docs/RELEASE_$VERSION.md"
      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/upload_curseforge.py "$GITHUB_REF_NAME"
