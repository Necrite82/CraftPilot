name: Catalog inputs (client tables)

# Downloads the WoW Forever client tables (DB2 as CSV from wago.tools) that CraftPilot's own recipe catalog is
# built from and publishes them, gzipped with a manifest, as the orphan branch `catalog-inputs`.
# Republished only when a table changed. Nothing here is shipped with the addon.
on:
  push:
    branches: [dev]
    paths:
      - tools/catalog/fetch_inputs.py
      - .github/workflows/catalog-inputs.yml
  schedule:
    - cron: '23 4 * * 1,4'   # Monday and Thursday, 04:23 UTC
  workflow_dispatch:
    inputs:
      build:
        description: 'Forever build (empty = newest on wago.tools)'
        required: false

permissions:
  contents: write

concurrency:
  group: catalog-inputs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download client tables
        env:
          BUILD: ${{ inputs.build }}
        run: python3 tools/catalog/fetch_inputs.py --out "$RUNNER_TEMP/inputs" ${BUILD:+--build "$BUILD"}

      - name: Publish to the catalog-inputs branch
        run: |
          set -e
          new=$(cat "$RUNNER_TEMP/inputs/FINGERPRINT")
          old=$(git show origin/catalog-inputs:FINGERPRINT 2>/dev/null || true)
          if [ "$new" = "$old" ]; then echo "Unchanged ($new)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan catalog-inputs
          git rm -rfq .
          git clean -fdxq
          cp "$RUNNER_TEMP"/inputs/* .
          printf '# Catalog inputs\n\nWoW Forever client tables (DB2, from wago.tools) for CraftPilot'"'"'s catalog builder.\nGenerated by `.github/workflows/catalog-inputs.yml`; see manifest.json. Not part of the addon.\n' > README.md
          git add -A
          git commit -qm "Client tables $(python3 -c 'import json;m=json.load(open("manifest.json"));print(m["build"], "/ era", m["eraBuild"])')"
          git push -f origin catalog-inputs
